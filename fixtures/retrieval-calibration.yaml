# Original synthetic rules, CC0. No reference-manual content or questions.
# Separate threshold calibration corpus, not evidence of real-book quality.
passages:
  - page: 11
    section: Lantern Keepers > Movement > Mist Ferry
    text: >-
      Each trip on a Mist Ferry costs four glowstones per traveller. The fare
      must be paid before boarding. Carrying a lantern does not waive the fare.
  - page: 12
    section: Lantern Keepers > Gear > Lantern charge
    text: >-
      A lantern has six charges. Each watch consumes one charge. Refilling a
      lantern requires two glowstones and a rest at a beacon. An empty lantern
      cannot reveal hidden paths until it is refilled.
  - page: 13
    section: Lantern Keepers > Travel > Night watch
    text: >-
      On night watch, roll two D8 and add Vigilance. A total of twelve or more
      reveals an approaching danger. Failing the watch roll costs one lantern
      charge but does not cause physical injury.
  - page: 14
    section: Lantern Keepers > Gear > Repairs
    text: >-
      Broken travel gear must be repaired at a workshop. Roll Craft against
      difficulty nine and pay three glowstones for parts. Recharging an item
      never repairs it. A hired craftsperson charges eight glowstones.
  - page: 15
    section: Lantern Keepers > Travel > Lookout talent
    text: >-
      The Lookout talent requires Vigilance five. A Lookout rolls three D8 on
      night watch and keeps the best two. The target total remains twelve.
      The talent does not change the charge consumed on a failed roll.
  - page: 16
    section: Lantern Keepers > Movement > Heavy luggage
    text: >-
      Each traveller may carry two large bags. Every additional large bag
      requires paying one extra glowstone when boarding a Mist Ferry. This
      surcharge is added to the normal fare and cannot be waived by a talent.
