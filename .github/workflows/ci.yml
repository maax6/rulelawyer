name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev

      # Passe en premier : aucun intérêt à lancer les tests sur un dépôt qui
      # contient déjà un livre.
      - name: Aucun contenu interdit versionné
        run: uv run python scripts/guard_repo.py --tracked

      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
